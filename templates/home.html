<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Overview{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <section class="intro-section" data-aos="fade-up">
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Ranchers&display=swap");
        </style>
        <div class = "big-intro">
            <h2>Boycott Detector</h2>
        </div>
    </section>

    <section class="info-section" data-aos="fade-up">
        <p class="basic-info">

            Show me the brand and I will tell you all you need to know!
        </p>
    </section>

    <section>
        <button id="start-camera">Enable Camera</button>
        <video id = "video" autoplay playsinline style = "display:none;"></video>
        <canvas id="canvas"style="display:none;"></canvas>   
        <div id="brand-info"></div> 
    </section>

    <script>
        const video = <document.getElementById('video');
        const canvas = document.getElementbyId('canvas');
        const ctx = canvas.getContext('2d');
        const brandInfoDiv = document.getElementById('brand-info');
        const startBtn = document.getElementById('start-camera');

        startBtn.addEventListener('click', () => {
            navigatorr.mediaDevices.getUserMedia({video: true})
                .then(stream => {
                    //ok so this hides the button after camera is on; webcam feed is hidden until consent; same for canvas
                    startBtn.style.display = "none"
                    video.style.display = "block";
                    canvas.style.display = "block";

                    video.srcObject = stream;
                })
                .catch(err => {
                    console.error("Camera access denied; request permission pls", err);
                    alert("Camera is required to detect brands.");

                });
        })
</body>
