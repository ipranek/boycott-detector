<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Overview{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <section class="intro-section" data-aos="fade-up">
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Ranchers&display=swap");
        </style>
        <div class = "big-intro">
            <h2>Boycott Detector</h2>
        </div>
    </section>

    <section class="info-section" data-aos="fade-up">
        <p class="basic-info">

            Show me the brand and I will tell you all you need to know!
        </p>
    </section>

    <section>
        <button id="start-camera">Enable Camera</button>
        <video id = "video" autoplay playsinline style = "display:none;"></video>
        <canvas id="canvas"style="display:none;"></canvas>   
        <div id="brand-info"></div> 
    </section>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const brandInfoDiv = document.getElementById('brand-info');
        const startBtn = document.getElementById('start-camera');

        startBtn.addEventListener('click', () => {
            navigator.mediaDevices.getUserMedia({video: true})
                .then(stream => {
                    //ok so this hides the button after camera is on; webcam feed is hidden until consent; same for canvas
                    startBtn.style.display = "none"
                    video.style.display = "block";
                    canvas.style.display = "block";

                    video.srcObject = stream;
                })
                .catch(err => {
                    console.error("Camera access denied; request permission pls", err);
                    alert("Camera is required to detect brands.");

                });
            
            setInterval(() => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);

                canvas.toBlob(blob => {
                    const formData = new FormData();
                    formData.append("frame", blob, "frame.jpg");

                    fetch("http://127.0.0.1:5001/detect", {
                        method: "POST",
                        body: formData
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.brand) {
                            brandInfoDiv.innerHTML = `
                                <h3>Brand: ${data.brand}</h3>
                                <p>Status: ${data.status}</p>
                                <p>Reason: ${data.reason}</p>
                            `;

                        
                        }
                    });
                }, "image/jpeg");
            }, 500);
        })


</body>
